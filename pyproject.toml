requires-python = "~=3.13.0"
dependencies = [
    "numpy>=1.24.0",
    "bvhio>=1.5.4",
    "pygltflib>=1.16.5",
    "pytest>=9.0.1",
    "pytest-benchmark>=5.2.3",
    "numba>=0.62.1",
    "scipy>=1.16.3",
]
